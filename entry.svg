    THE WORLD IN ONE IMAGE — Thursday, 19 November 2026
    A broadsheet front page summarising one day of world news, drawn
    entirely by hand as vector shapes and text in this file.
    Canvas 1024 x 1024, page margins 44 px. Palette: warm paper,
    near-black ink, wire red, deep navy for the hero, a little gold.
    Type: Noto Sans and Noto Sans Condensed (system fonts).
    Layout: masthead to y=205; hero 210-510; ticker 524-562;
